name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Unit tests, type check, library and demo builds
        run: docker compose --profile test run --build --rm test

      - name: Browser regression tests
        run: docker compose --profile test run --build --rm e2e

      - name: Verify production runtime health
        run: docker compose up --build --detach --wait --wait-timeout 30 web

      - name: Upload browser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Stop containers
        if: always()
        run: docker compose down --remove-orphans
